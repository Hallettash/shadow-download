# Template for Hallettash/shadow-download only; not enabled in the engineering project.
# Configure github-pages environment required reviewers and main-only deployment first.
name: Publish Founder-approved Shadow repository
on:
  workflow_dispatch:
    inputs:
      candidate_sha256:
        description: SHA256 of reviewed site/deployment-manifest.json
        required: true
        type: string
      approval:
        description: Type PUBLISH REVIEWED SHADOW CANDIDATE
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: shadow-pages-publication
  cancel-in-progress: false
jobs:
  verify:
    if: github.ref == 'refs/heads/main' && inputs.approval == 'PUBLISH REVIEWED SHADOW CANDIDATE'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Verify exact approved candidate and retain existing downloads
        env:
          SHADOW_APPROVED_MANIFEST: ${{ inputs.candidate_sha256 }}
        run: python delivery/tools/prepare_pages.py --candidate delivery/site --existing . --output _shadow_pages --approved-sha "$SHADOW_APPROVED_MANIFEST"
      # Match upload-pages-artifact's Linux archive format without its unpinned nested action.
      - name: Archive verified Pages artifact
        run: tar --dereference --hard-dereference --directory _shadow_pages -cf "$RUNNER_TEMP/artifact.tar" --exclude=.git --exclude=.github .
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: github-pages
          path: ${{ runner.temp }}/artifact.tar
          retention-days: 1
          if-no-files-found: error
  publish:
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish approved static artifact
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e
